<!-- ==========================================================================
     COMPONENT: Top Navigation Bar (คอมโพเนนต์แถบเมนูด้านบน)
     File: components/layouts/Navbar.html
     Description: Reusable top navigation bar featuring Startass branding,
                  search bar with category popover, orders badge, chat badge,
                  auction creator CTA, notification dropdown, and user profile.
     ========================================================================== -->

<nav class="site-navbar" role="navigation" aria-label="แถบนำทางหลัก (Main Navigation)">
  <div class="navbar-container">
    <!-- Brand Logo & Home Link -->
    <a href="HomePage.html" class="navbar-brand" title="STARTASS หน้าหลักการประมูล">
      <img src="../images/logo.png" alt="STARTASS Logo" class="navbar-logo-img">
      <span class="navbar-brand-name">STAR <span>TASS!</span></span>
    </a>

    <!-- Navbar Search with Interactive Category Dropdown Popover -->
    <div class="navbar-search-wrapper" id="navbarSearchWrapper">
      <div class="navbar-search-bar" id="navbarSearchBar">
        <i class="fa-solid fa-magnifying-glass search-icon" id="navbarSearchIcon" title="คลิกหรือกด Enter เพื่อค้นหา" style="cursor: pointer;"></i>
        <input type="text" id="itemSearch" placeholder="ค้นหาชื่อสินค้า, หมวดหมู่ หรือคำสำคัญ... (กด Enter เพื่อค้นหา)" autocomplete="off">
        <button type="button" id="clearSearchBtn" class="search-clear-btn" aria-label="ล้างการค้นหา" style="display: none;">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Interactive Dropdown Popover on Focus/Click -->
      <div class="navbar-search-dropdown" id="navbarSearchDropdown" style="display: none;">
        <div class="search-dropdown-header">
          <span class="search-dropdown-title">
            <i class="fa-solid fa-sliders" style="color: var(--accent-gold);"></i> เลือกหมวดหมู่ที่ต้องการค้นหา:
          </span>
          <span class="search-dropdown-tip">คลิกเพื่อกรองสินค้า</span>
        </div>

        <div class="search-dropdown-categories">
          <button type="button" class="search-cat-chip" data-category="all" onclick="handleNavbarCategorySelect('all')">
            <i class="fa-solid fa-border-all"></i> ทุกหมวดหมู่
            <span class="search-cat-count" id="navCountAll">14</span>
          </button>
          <button type="button" class="search-cat-chip" data-category="cars" onclick="handleNavbarCategorySelect('cars')">
            <i class="fa-solid fa-car-side"></i> รถยนต์ & ซูเปอร์คาร์
            <span class="search-cat-count" id="navCountCars">4</span>
          </button>
          <button type="button" class="search-cat-chip" data-category="cards" onclick="handleNavbarCategorySelect('cards')">
            <i class="fa-solid fa-ticket"></i> การ์ดสะสมหายาก
            <span class="search-cat-count" id="navCountCards">3</span>
          </button>
          <button type="button" class="search-cat-chip" data-category="tech" onclick="handleNavbarCategorySelect('tech')">
            <i class="fa-solid fa-microchip"></i> เทคโนโลยี & คอมพิวเตอร์
            <span class="search-cat-count" id="navCountTech">4</span>
          </button>
          <button type="button" class="search-cat-chip" data-category="trees" onclick="handleNavbarCategorySelect('trees')">
            <i class="fa-solid fa-tree"></i> บอนไซ & ไม้ด่างหายาก
            <span class="search-cat-count" id="navCountTrees">3</span>
          </button>
        </div>

        <div class="search-dropdown-footer">
          <div class="trending-tags-title">
            <i class="fa-solid fa-fire" style="color: #f97316;"></i> แนะนำ:
          </div>
          <div class="trending-tags-list">
            <button type="button" class="trending-tag" onclick="selectQuickSearch('Porsche 911 GT3')">Porsche 911</button>
            <button type="button" class="trending-tag" onclick="selectQuickSearch('Pikachu Illustrator')">Pikachu</button>
            <button type="button" class="trending-tag" onclick="selectQuickSearch('Quantum Core')">Supercomputer</button>
            <button type="button" class="trending-tag" onclick="selectQuickSearch('บอนไซสนดำ')">บอนไซสนดำ</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Navbar Action Group -->
    <div class="navbar-actions">
      <!-- Optional Back to Auctions Link (displayed on subpages like Orders, Payment) -->
      <a href="HomePage.html" class="btn btn-view" id="navBackToAuctionsBtn" title="กลับไปหน้ากระดานประมูลหลัก" style="display: none;">
        <i class="fa-solid fa-arrow-left"></i>
        <span>กระดานประมูล</span>
      </a>

      <!-- My Orders Navigation Button -->
      <a href="orders.html" class="btn-orders-nav" id="navOrdersBtn" title="ดูรายการคำสั่งซื้อ / การประมูลของฉัน">
        <i class="fa-solid fa-receipt"></i>
        <span>คำสั่งซื้อของฉัน</span>
        <span class="orders-nav-badge" id="navOrdersBadge" style="display: none;">0</span>
      </a>

      <!-- Messages Navigation Button -->
      <a href="chat.html" class="btn-chat-nav" id="navChatBtn" title="ข้อความและการสนทนา P2P (Messages & P2P Chat)">
        <i class="fa-solid fa-comments"></i>
        <span>ข้อความ</span>
        <span class="chat-nav-badge" id="navChatBadge" style="display: none;">0</span>
      </a>

      <!-- Create Auction Listing Button -->
      <button type="button" class="btn btn-create-auction" id="openCreateModalBtn" onclick="openCreateModal()">
        <i class="fa-solid fa-plus"></i>
        <span>สร้างโพสต์ประมูล</span>
      </button>

      <!-- Notification Bell Dropdown -->
      <div class="notification-dropdown-wrapper" id="notificationDropdownWrapper">
        <button type="button" class="notification-btn" id="notificationBtn" onclick="toggleNotificationDropdown(event)" aria-expanded="false" aria-haspopup="true" title="การแจ้งเตือน (Notifications & Outbid Alerts)">
          <i class="fa-regular fa-bell"></i>
          <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
        </button>

        <!-- Notification Dropdown Menu -->
        <div class="notification-dropdown-menu" id="notificationDropdownMenu">
          <div class="notification-dropdown-header">
            <div class="notification-header-title">
              <i class="fa-solid fa-bell" style="color: var(--accent-gold);"></i>
              <span>การแจ้งเตือน</span>
              <span class="notification-count-tag" id="notificationCountTag">0 ข้อความใหม่</span>
            </div>
            <button type="button" class="btn-clear-notifications" onclick="markAllNotificationsRead(event)" title="ทำเครื่องหมายว่าอ่านแล้วทั้งหมด">
              <i class="fa-solid fa-check-double"></i> อ่านทั้งหมด
            </button>
          </div>

          <!-- Notification Items List -->
          <div class="notification-list" id="notificationList">
            <!-- Populated dynamically via JS -->
          </div>

          <div class="notification-dropdown-footer">
            <button type="button" class="btn-simulate-outbid" onclick="simulateOutbid(event)" title="จำลองสถานการณ์เมื่อมีคนอื่นมาบิดแซงเรา">
              <i class="fa-solid fa-bolt"></i>
              <span>⚡ จำลองการโดนเสนอราคาแซง (Simulate Outbid)</span>
            </button>
            <button type="button" class="btn-simulate-outbid btn-simulate-won" onclick="simulateAuctionWon(null, event)" title="จำลองสถานการณ์ชนะการประมูลเพื่อปลดล็อกสิทธิ์ P2P Chat กับผู้ขาย">
              <i class="fa-solid fa-trophy"></i>
              <span>⚡ จำลองการชนะประมูล & ปลดล็อกสิทธิ์แชต P2P</span>
            </button>
          </div>
        </div>
      </div>

      <!-- User Profile Dropdown -->
      <div class="profile-dropdown-wrapper" id="profileDropdownWrapper">
        <button type="button" class="profile-btn" id="profileBtn" onclick="toggleProfileDropdown(event)" aria-expanded="false" aria-haspopup="true" title="ดูโปรไฟล์ Alexander Sterling">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" alt="Profile" class="profile-avatar" id="navProfileAvatar">
        </button>

        <!-- Dropdown Menu Content -->
        <div class="profile-dropdown-menu" id="profileDropdownMenu">
          <div class="profile-dropdown-header">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" alt="Avatar" class="dropdown-avatar-lg" id="menuProfileAvatar">
            <div class="profile-dropdown-user-info">
              <span class="profile-full-name-label">ชื่อผู้ใช้งาน</span>
              <span class="profile-full-name" id="userFullName">Alexander Sterling</span>
            </div>
          </div>

          <div class="profile-dropdown-divider"></div>

          <ul class="profile-menu-list">
            <li>
              <a href="MyProfileDetails.html" class="profile-menu-item" style="text-decoration: none;">
                <i class="fa-solid fa-user"></i>
                <span>โปรไฟล์ของฉัน (My Profile)</span>
              </a>
            </li>
            <li>
              <a href="orders.html" class="profile-menu-item" style="text-decoration: none;">
                <i class="fa-solid fa-file-invoice-dollar"></i>
                <span>คำสั่งซื้อ & รายการประมูลของฉัน (My Orders)</span>
              </a>
            </li>
            <li>
              <a href="chat.html" class="profile-menu-item" style="text-decoration: none;">
                <i class="fa-solid fa-comments"></i>
                <span>กล่องข้อความ & แชต P2P กับผู้ขาย (Messages)</span>
              </a>
            </li>
            <li>
              <button type="button" class="profile-menu-item text-danger" onclick="handleLogout()">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span>ออกจากระบบ (Logout)</span>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</nav>
