<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>STARTASS - การสนทนาและแชต P2P กับผู้ขาย (P2P Chat & Messages)</title>
  
  <!-- Browser Tab Icon (Favicon) -->
  <link rel="icon" type="image/png" href="../images/logo.png">
  <link rel="shortcut icon" type="image/png" href="../images/logo.png">
  <link rel="apple-touch-icon" href="../images/logo.png">
  
  <!-- Google Fonts: Prompt & Kanit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Platform Stylesheet -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- COMPONENT: Top Navbar Layout (แถบเมนูด้านบน) -->
  <div id="appNavbarContainer"></div>

  <!-- Main Container -->
  <div class="container chat-page-wrapper">
    <!-- Breadcrumbs -->
    <nav class="order-breadcrumbs" aria-label="Breadcrumb">
      <a href="HomePage.html"><i class="fa-solid fa-house"></i> หน้าหลัก</a>
      <span class="crumb-sep">/</span>
      <a href="orders.html">คำสั่งซื้อของฉัน</a>
      <span class="crumb-sep">/</span>
      <span class="crumb-active" id="chatBreadcrumbCurrent">ข้อความ & แชต P2P</span>
    </nav>

    <!-- Standalone Chat Two-Part Layout -->
    <div class="standalone-chat-container" id="standaloneChatContainer">
      
      <!-- ====================================================================
           PART 1: CONVERSATION HISTORY (LEFT SIDEBAR)
           Image Profile, User Name, Latest Message, Time & Date, Is Read or Not Read
           ==================================================================== -->
      <aside class="standalone-chat-sidebar" id="standaloneChatSidebar">
        
        <!-- Sidebar Header -->
        <div class="chat-sidebar-header">
          <div class="chat-sidebar-heading">
            <i class="fa-solid fa-comments"></i>
            <span>ประวัติการสนทนา</span>
          </div>
          <span class="chat-conv-count-badge" id="chatConvCountBadge">3 รายการ</span>
        </div>

        <!-- Filter Chips: All, Unread -->
        <div class="chat-filter-chips-strip">
          <button type="button" class="btn-chat-filter active" data-filter="all" onclick="setChatFilter('all', this)">
            <span>ทั้งหมด</span>
          </button>
          <button type="button" class="btn-chat-filter" data-filter="unread" onclick="setChatFilter('unread', this)">
            <span>ยังไม่อ่าน</span>
            <span class="filter-unread-dot"></span>
          </button>
        </div>

        <!-- Search Bar -->
        <div class="chat-search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="chatSearchInput" placeholder="ค้นหาชื่อผู้ขาย หรือรายการสินค้า..." oninput="filterStandaloneChatList(this.value)">
          <button type="button" class="chat-search-clear" id="chatSearchClearBtn" onclick="clearStandaloneChatSearch()" style="display: none;">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Conversations History List -->
        <div class="chat-conversations-scroll" id="chatConversationsList">
          <!-- Populated dynamically via renderStandaloneChatConversations() in main.js -->
        </div>

      </aside>

      <!-- ====================================================================
           PART 2: CURRENT CHAT (RIGHT MAIN WINDOW)
           Image Profile, User Name, Messages All, Time Date in Message,
           Is Read or Not Read, If Part Owner Messages Show Product & Price Bids Latest
           ==================================================================== -->
      <main class="standalone-chat-main" id="standaloneChatMain">
        
        <!-- Current Chat Header -->
        <header class="chat-main-header" id="chatCurrentHeader">
          <!-- Populated dynamically via renderStandaloneCurrentChat() -->
        </header>

        <!-- Current Chat Live Deal Strip (Product and Latest Bids Price - Compact & Sleek) -->
        <div class="chat-live-deal-strip" id="chatLiveDealStrip">
          <!-- Populated dynamically via renderStandaloneCurrentChat() -->
        </div>

        <!-- Chat Messages Area -->
        <div class="chat-messages-area-wrapper" id="chatMessagesAreaWrapper">
          <!-- Messages All History Timeline -->
          <div class="chat-messages-timeline" id="chatMessagesTimeline">
            <!-- Populated dynamically with all messages, date/time, read status, and owner product & price bids -->
          </div>
        </div>

        <!-- Typing Indicator Banner (Seller Typing Simulation) -->
        <div class="chat-typing-indicator-row" id="chatTypingIndicator" style="display: none;">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" alt="Seller" class="chat-typing-avatar" id="typingSellerAvatar">
          <div class="chat-typing-bubble">
            <span class="chat-typing-name" id="typingSellerName">ผู้ขาย</span>
            <span class="chat-typing-label">กำลังพิมพ์ข้อความ</span>
            <span class="typing-dots">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </span>
          </div>
        </div>

        <!-- Quick Action Prompt Chips Bar with Typing Simulator -->
        <div class="chat-quick-actions-bar" id="chatQuickActionsBar">
          <span class="quick-label"><i class="fa-solid fa-wand-magic-sparkles"></i> จัดการธุรกรรม / จำลอง:</span>
          <div class="quick-chips-scroll">
            <button type="button" class="btn-quick-chip btn-chip-dealer-pay" onclick="handleChatGoToPayment()" title="💳 ไปยังหน้าชำระเงิน [ Payment.html ]">
              <i class="fa-solid fa-credit-card"></i> <span>💳 ไปยังหน้าชำระเงิน</span>
            </button>
            <button type="button" class="btn-quick-chip" onclick="handleStandaloneQuickPrompt('📍 ที่อยู่จัดส่ง: 88/12 อาคารพรีเมียมทาวเวอร์ สุขุมวิท 55 กทม. 10110 ครับ')">
              📍 ยืนยันที่อยู่จัดส่ง
            </button>
            <button type="button" class="btn-quick-chip" onclick="handleStandaloneQuickPrompt('🛡️ โอนเงินชำระเรียบร้อย พร้อมประสานงานปล่อยยอดเมื่อได้รับของครับ')">
              🛡️ ยืนยันการชำระเงิน
            </button>
            <button type="button" class="btn-quick-chip" onclick="handleStandaloneQuickPrompt('📜 รบกวนขอใบรับรอง Certificate of Authenticity (COA) เพิ่มเติมด้วยครับ')">
              📜 ขอเอกสาร COA
            </button>
            <button type="button" class="btn-quick-chip" onclick="handleStandaloneQuickPrompt('🚚 ขอบคุณครับ สะดวกรับของช่วงสุดสัปดาห์นี้ครับ')">
              🚚 สอบถามการจัดส่ง
            </button>
            <button type="button" class="btn-quick-chip btn-chip-sim" onclick="simulateTypingPrompt('📍 ยืนยันที่อยู่จัดส่ง: 450 Lexington Ave, New York, NY 10017 พร้อมรับมอบสินค้าครับ')" title="จำลองพิมพ์: ยืนยันที่อยู่">
              <i class="fa-solid fa-keyboard"></i> ยืนยันที่อยู่
            </button>
            <button type="button" class="btn-quick-chip btn-chip-sim" onclick="simulateTypingPrompt('📜 รบกวนส่งเอกสาร Certificate of Authenticity และผลตรวจสอบเบื้องต้นให้ดูทางนี้ด้วยครับ')" title="จำลองพิมพ์: ขอเอกสาร COA">
              <i class="fa-solid fa-keyboard"></i> ขอเอกสาร COA
            </button>
            <button type="button" class="btn-quick-chip btn-chip-seller-sim" onclick="simulateSellerResponseDirect()" title="⚡ จำลองให้ผู้ขายเริ่มพิมพ์และส่งข้อความตอบกลับ">
              <i class="fa-solid fa-robot"></i> ⚡ จำลองผู้ขายตอบกลับ
            </button>
          </div>
        </div>

        <!-- Message Composer Form Bar with Typing Simulator Button -->
        <form class="chat-composer-bar" id="standaloneChatForm" onsubmit="handleSendStandaloneChatMessage(event)">
          <div class="composer-input-wrapper">
            <input type="text" id="standaloneMessageInput" class="composer-input" placeholder="พิมพ์ข้อความถึงผู้ขาย หรือกดปุ่มจำลองพิมพ์..." autocomplete="off" required>
            <button type="button" class="btn-composer-simulate-mini" onclick="simulateRandomBuyerTyping()" title="⚡ จำลองพิมพ์ข้อความอัตโนมัติ (Simulate Auto-Type)">
              <i class="fa-solid fa-bolt"></i>
              <span>จำลองพิมพ์</span>
            </button>
          </div>
          <button type="submit" class="btn-composer-send" id="btnComposerSend" title="ส่งข้อความ (Send Message)">
            <i class="fa-solid fa-paper-plane"></i>
            <span>ส่ง</span>
          </button>
        </form>

      </main>

    </div>
  </div>

  <!-- COMPONENT: Payment Modal (ชำระเงินค่าสินค้า [ Dealer ]) -->
  <div id="escrowPaymentModalContainer"></div>

  <!-- COMPONENT: Auction Bid Modal (เสนอราคาประมูลสินค้า) -->
  <div id="auctionBidModalContainer"></div>

  <!-- COMPONENT: Auction Item Detail Modal (รายละเอียดรายการประมูล) -->
  <div id="auctionDetailModalContainer"></div>

  <!-- COMPONENT: Create Auction Listing Modal (สร้างโพสต์ประมูลสินค้า) -->
  <div id="createAuctionModalContainer"></div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Layout Components (คอมโพเนนต์แถบเมนูด้านบน) -->
  <script src="../components/layouts/Navbar.js"></script>

  <!-- Modal Components -->
  <script src="../components/modals/AuctionBidModal.js"></script>
  <script src="../components/modals/AuctionDetailModal.js"></script>
  <script src="../components/modals/EscrowPaymentModal.js"></script>
  <script src="../components/modals/CreateAuctionModal.js"></script>

  <!-- Platform Scripts -->
  <script src="../js/main.js"></script>
</body>
</html>
