<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>STARTASS - คำสั่งซื้อและการประมูลของฉัน (My Orders)</title>
  
  <!-- Browser Tab Icon (Favicon) -->
  <link rel="icon" type="image/png" href="../images/logo.png">
  <link rel="shortcut icon" type="image/png" href="../images/logo.png">
  <link rel="apple-touch-icon" href="../images/logo.png">
  
  <!-- Google Fonts: Prompt & Kanit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Platform Stylesheet -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- COMPONENT: Top Navbar Layout (แถบเมนูด้านบน) -->
  <div id="appNavbarContainer"></div>

  <!-- Main Container -->
  <div class="container order-page-wrapper">
    <!-- Dynamic Orders List Container -->
    <div id="ordersContainer">
      <!-- Loading Skeleton / Fallback State (replaced by initOrdersPage() on DOM Ready) -->
      <div style="text-align: center; padding: 60px 20px;">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2.5rem; color: var(--accent-gold); margin-bottom: 16px;"></i>
        <p style="color: var(--text-secondary);">กำลังโหลดข้อมูลคำสั่งซื้อและการประมูล...</p>
      </div>
    </div>
  </div>

  <!-- COMPONENT: Auction Bid Modal (เสนอราคาประมูลสินค้า) -->
  <div id="auctionBidModalContainer"></div>

  <!-- COMPONENT: Auction Item Detail Modal (รายละเอียดรายการประมูล) -->
  <div id="auctionDetailModalContainer"></div>

  <!-- COMPONENT: Create Auction Listing Modal (สร้างโพสต์ประมูลสินค้า) -->
  <div id="createAuctionModalContainer"></div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Layout Components (คอมโพเนนต์แถบเมนูด้านบน) -->
  <script src="../components/layouts/Navbar.js"></script>

  <!-- Modal Components -->
  <script src="../components/modals/AuctionBidModal.js"></script>
  <script src="../components/modals/AuctionDetailModal.js"></script>
  <script src="../components/modals/CreateAuctionModal.js"></script>

  <!-- Platform Scripts -->
  <script src="../js/main.js"></script>
</body>
</html>
