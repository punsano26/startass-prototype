<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>STARTASS - รายละเอียดคำสั่งซื้อและการประมูล (Order & Auction Details)</title>
  
  <!-- Browser Tab Icon (Favicon) -->
  <link rel="icon" type="image/png" href="../images/logo.png">
  <link rel="shortcut icon" type="image/png" href="../images/logo.png">
  <link rel="apple-touch-icon" href="../images/logo.png">
  
  <!-- Google Fonts: Prompt & Kanit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Platform Stylesheet -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Top Navbar: Clean & Prominent Brand Logo, All Auctions Link, Create Auction & Profile Dropdown -->
  <nav class="site-navbar">
    <div class="navbar-container">
      <a href="HomePage.html" class="navbar-brand">
        <img src="../images/logo.png" alt="STARTASS Logo" class="navbar-logo-img">
        <span class="navbar-brand-name">STAR <span>TASS!</span></span>
      </a>

      <div class="navbar-actions">
        <!-- Back to Auctions Link -->
        <a href="HomePage.html" class="btn btn-view" title="กลับไปหน้ากระดานประมูลหลัก">
          <i class="fa-solid fa-arrow-left"></i>
          <span>กระดานประมูล</span>
        </a>

        <!-- My Orders Navigation Button (Active) -->
        <a href="ordersdetail.html" class="btn-orders-nav active" id="navOrdersBtn" title="หน้ารายการคำสั่งซื้อ / การประมูลของฉัน">
          <i class="fa-solid fa-receipt"></i>
          <span>คำสั่งซื้อของฉัน</span>
          <span class="orders-nav-badge" id="navOrdersBadge">1</span>
        </a>

        <!-- Messages Navigation Button -->
        <a href="chat.html" class="btn-chat-nav" id="navChatBtn" title="ข้อความและการสนทนา P2P (Messages & P2P Chat)">
          <i class="fa-solid fa-comments"></i>
          <span>ข้อความ</span>
          <span class="chat-nav-badge" id="navChatBadge" style="display: none;">0</span>
        </a>

        <!-- Create Auction Button -->
        <button type="button" class="btn btn-create-auction" onclick="openCreateModal()">
          <i class="fa-solid fa-plus"></i>
          <span>สร้างโพสต์ประมูล</span>
        </button>

        <!-- Notification Bell Dropdown -->
        <div class="notification-dropdown-wrapper" id="notificationDropdownWrapper">
          <button type="button" class="notification-btn" id="notificationBtn" onclick="toggleNotificationDropdown(event)" aria-expanded="false" aria-haspopup="true" title="การแจ้งเตือน (Notifications & Outbid Alerts)">
            <i class="fa-regular fa-bell"></i>
            <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
          </button>

          <!-- Notification Dropdown Menu -->
          <div class="notification-dropdown-menu" id="notificationDropdownMenu">
            <div class="notification-dropdown-header">
              <div class="notification-header-title">
                <i class="fa-solid fa-bell" style="color: var(--accent-gold);"></i>
                <span>การแจ้งเตือน</span>
                <span class="notification-count-tag" id="notificationCountTag">0 ข้อความใหม่</span>
              </div>
              <button type="button" class="btn-clear-notifications" onclick="markAllNotificationsRead(event)" title="ทำเครื่องหมายว่าอ่านแล้วทั้งหมด">
                <i class="fa-solid fa-check-double"></i> อ่านทั้งหมด
              </button>
            </div>

            <!-- Notification Items List -->
            <div class="notification-list" id="notificationList">
              <!-- Populated dynamically via JS -->
            </div>

            <div class="notification-dropdown-footer">
              <button type="button" class="btn-simulate-outbid" onclick="simulateOutbid(event)" title="จำลองสถานการณ์เมื่อมีคนอื่นมาบิดแซงเรา">
                <i class="fa-solid fa-bolt"></i>
                <span>⚡ จำลองการโดนเสนอราคาแซง (Simulate Outbid)</span>
              </button>
              <button type="button" class="btn-simulate-outbid btn-simulate-won" onclick="simulateAuctionWon(null, event)" title="จำลองสถานการณ์ชนะการประมูลเพื่อปลดล็อกสิทธิ์ P2P Chat กับผู้ขาย">
                <i class="fa-solid fa-trophy"></i>
                <span>⚡ จำลองการชนะประมูล & ปลดล็อกสิทธิ์แชต P2P</span>
              </button>
            </div>
          </div>
        </div>

        <!-- User Profile Dropdown -->
        <div class="profile-dropdown-wrapper" id="profileDropdownWrapper">
          <button type="button" class="profile-btn" id="profileBtn" onclick="toggleProfileDropdown(event)" aria-expanded="false" aria-haspopup="true" title="ดูโปรไฟล์ Alexander Sterling">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" alt="Profile" class="profile-avatar" id="navProfileAvatar">
          </button>

          <!-- Dropdown Menu Content -->
          <div class="profile-dropdown-menu" id="profileDropdownMenu">
            <div class="profile-dropdown-header">
              <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" alt="Avatar" class="dropdown-avatar-lg" id="menuProfileAvatar">
              <div class="profile-dropdown-user-info">
                <span class="profile-full-name-label">ชื่อผู้ใช้งาน</span>
                <span class="profile-full-name" id="userFullName">Alexander Sterling</span>
              </div>
            </div>

            <div class="profile-dropdown-divider"></div>

            <ul class="profile-menu-list">
              <li>
                <a href="MyProfileDetails.html" class="profile-menu-item" style="text-decoration: none;">
                  <i class="fa-solid fa-user"></i>
                  <span>โปรไฟล์ของฉัน (My Profile)</span>
                </a>
              </li>
              <li>
                <a href="ordersdetail.html" class="profile-menu-item" style="text-decoration: none;">
                  <i class="fa-solid fa-file-invoice-dollar"></i>
                  <span>คำสั่งซื้อ & รายการประมูลของฉัน (My Orders)</span>
                </a>
              </li>
              <li>
                <a href="chat.html" class="profile-menu-item" style="text-decoration: none;">
                  <i class="fa-solid fa-comments"></i>
                  <span>กล่องข้อความ & แชต P2P กับผู้ขาย (Messages)</span>
                </a>
              </li>
              <li>
                <button type="button" class="profile-menu-item text-danger" onclick="handleLogout()">
                  <i class="fa-solid fa-arrow-right-from-bracket"></i>
                  <span>ออกจากระบบ (Logout)</span>
                </button>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container order-page-wrapper">
    <!-- Dynamic Order Detail Container -->
    <div id="orderDetailContainer">
      <!-- Loading Skeleton / Fallback State (replaced by initOrderDetailPage() on DOM Ready) -->
      <div style="text-align: center; padding: 60px 20px;">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2.5rem; color: var(--accent-gold); margin-bottom: 16px;"></i>
        <p style="color: var(--text-secondary);">กำลังโหลดข้อมูลคำสั่งซื้อและการประมูล...</p>
      </div>
    </div>
  </div>

  <!-- COMPONENT: Auction Bid Modal (เสนอราคาประมูลสินค้า) -->
  <div id="auctionBidModalContainer"></div>

  <!-- COMPONENT: Auction Item Detail Modal (รายละเอียดรายการประมูล) -->
  <div id="auctionDetailModalContainer"></div>

  <!-- COMPONENT: Create Auction Listing Modal (สร้างโพสต์ประมูลสินค้า) -->
  <div id="createAuctionModalContainer"></div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Modal Components -->
  <script src="../components/modals/AuctionBidModal.js"></script>
  <script src="../components/modals/AuctionDetailModal.js"></script>
  <script src="../components/modals/CreateAuctionModal.js"></script>

  <!-- Platform Scripts -->
  <script src="../js/main.js"></script>
</body>
</html>
